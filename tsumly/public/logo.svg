<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Tsumu, the coin-stack mascot — code-drawn from the app's own
       mascot.dart geometry (three askew amber coins, ink face, purple
       party hat). Ink parts use currentColor so the mark follows the
       theme; coin fills and the hat are always the brand colours. -->
  <!-- Ground shadow. -->
  <ellipse cx="50" cy="87.5" rx="30" ry="4.25" fill="currentColor" opacity="0.08" />
  <!-- Bottom coin. -->
  <ellipse cx="48.2" cy="81.7" rx="30" ry="8.8" fill="#9A6206" opacity="0.85" />
  <rect x="18.2" y="74.5" width="60" height="7.2" fill="#E0950F" />
  <ellipse cx="48.2" cy="74.5" rx="30" ry="8.8" fill="#F2A81D" />
  <path d="M18.2,74.5 L18.2,81.7 Q18.2,90.5 48.2,90.5 Q78.2,90.5 78.2,81.7 L78.2,74.5 Q78.2,64.6 48.2,65.7 Q18.2,64.6 18.2,74.5 Z" fill="none" stroke="#9A6206" stroke-width="1.3" stroke-linejoin="round" />
  <!-- Middle coin (carries the face). -->
  <ellipse cx="52.2" cy="69" rx="30" ry="8.8" fill="#9A6206" opacity="0.85" />
  <rect x="22.2" y="61.8" width="60" height="7.2" fill="#E0950F" />
  <ellipse cx="52.2" cy="61.8" rx="30" ry="8.8" fill="#F2A81D" />
  <path d="M22.2,61.8 L22.2,69 Q22.2,77.8 52.2,77.8 Q82.2,77.8 82.2,69 L82.2,61.8 Q82.2,51.9 52.2,53 Q22.2,51.9 22.2,61.8 Z" fill="none" stroke="#9A6206" stroke-width="1.3" stroke-linejoin="round" />
  <!-- Top coin. -->
  <ellipse cx="49" cy="56.3" rx="30" ry="8.8" fill="#9A6206" opacity="0.85" />
  <rect x="19" y="49.1" width="60" height="7.2" fill="#E0950F" />
  <ellipse cx="49" cy="49.1" rx="30" ry="8.8" fill="#F2A81D" />
  <path d="M19,49.1 L19,56.3 Q19,65.1 49,65.1 Q79,65.1 79,56.3 L79,49.1 Q79,39.2 49,40.3 Q19,39.2 19,49.1 Z" fill="none" stroke="#9A6206" stroke-width="1.3" stroke-linejoin="round" />
  <!-- Inner rim + sparkle on the top coin. -->
  <ellipse cx="49" cy="49.1" rx="21.3" ry="5.7" fill="none" stroke="#9A6206" stroke-opacity="0.55" stroke-width="0.8" />
  <path d="M49,44.6 L50.3,47.8 L53.5,49.1 L50.3,50.4 L49,53.6 L47.7,50.4 L44.5,49.1 L47.7,47.8 Z" fill="#9A6206" opacity="0.75" />
  <!-- Face on the middle coin's band (left eye a touch bigger). -->
  <circle cx="46" cy="65.2" r="2.6" fill="currentColor" />
  <circle cx="58.4" cy="65.2" r="2.2" fill="currentColor" />
  <path d="M57.6,67.7 A5.75,3.75 0 0 1 46.8,67.7" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
  <circle cx="39.7" cy="67.4" r="2.1" fill="#E8734A" opacity="0.45" />
  <circle cx="64.7" cy="67.4" r="2.1" fill="#E8734A" opacity="0.45" />
  <!-- Party hat (arms omitted — the site mark stays legible at 20–28px). -->
  <path d="M41.5,41.5 L56.5,41.5 L52,25.5 Z" fill="#6C4DE6" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round" />
  <circle cx="52" cy="24.5" r="3.2" fill="#F2A81D" stroke="#9A6206" stroke-width="0.9" />
</svg>
